<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SION CFC Cloud</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (アイコン用) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* カスタムスクロールバー等 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    
    <!-- ヘッダー -->
    <nav class="bg-gray-800 border-b border-cyan-500/30 p-4 shadow-lg sticky top-0 z-10">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-cyan-400 tracking-wider">
                <i class="fa-solid fa-cloud"></i> SION CFC Cloud
            </h1>
            <div class="text-sm px-3 py-1 bg-gray-700 rounded-full border border-gray-600">
                管理者ダッシュボード
            </div>
        </div>
    </nav>

    <!-- メインコンテンツ -->
    <main class="container mx-auto p-4 mt-6">
        
        <!-- サマリーカード -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-md relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-cyan-400 text-5xl"><i class="fa-solid fa-server"></i></div>
                <div class="text-gray-400 text-sm mb-1 font-medium">登録機器数</div>
                <div class="text-4xl font-bold text-white" id="machine-count">-</div>
            </div>
            
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-md relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-yellow-400 text-5xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div class="text-gray-400 text-sm mb-1 font-medium">今月の要点検</div>
                <div class="text-4xl font-bold text-yellow-400">0<span class="text-lg font-normal text-gray-500 ml-2">件</span></div>
            </div>
            
            <div class="bg-gray-800 p-6 rounded-xl border border-red-900/50 shadow-md relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-red-500 text-5xl"><i class="fa-solid fa-bell"></i></div>
                <div class="text-gray-400 text-sm mb-1 font-medium">漏洩アラート</div>
                <div class="text-4xl font-bold text-red-500">0<span class="text-lg font-normal text-gray-500 ml-2">件</span></div>
            </div>
        </div>
        
        <!-- コントロールパネル -->
        <div class="flex justify-between items-end mb-4 border-b border-gray-700 pb-2">
            <h2 class="text-xl font-semibold text-gray-200">フロン機器台帳</h2>
            <button onclick="fetchMachineData()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-sm transition-colors shadow-lg shadow-cyan-500/20"><button onclick="openModal()" class="px-4 py-2 bg-green-600 hover:bg-green-500 text-white rounded-lg text-sm transition-colors shadow-lg shadow-green-500/20 mr-2">
                <i class="fa-solid fa-plus mr-1"></i> 新規登録
            </button>
                <i class="fa-solid fa-rotate-right mr-1"></i> 最新に更新
            </button>
        </div>

        <!-- データテーブル -->
        <div class="bg-gray-800 rounded-xl overflow-hidden border border-gray-700 shadow-lg">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="bg-gray-900/50 text-gray-400 text-sm border-b border-gray-700">
                            <th class="p-4 font-medium">管理番号</th>
                            <th class="p-4 font-medium">施設・設置場所</th>
                            <th class="p-4 font-medium">メーカー/型式</th>
                            <th class="p-4 font-medium text-center">ステータス</th>
                        </tr>
                    </thead>
                    <tbody id="machine-list">
                        <tr><td colspan="4" class="p-10 text-center text-gray-500">
                            <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-3 text-cyan-500"></i><br>
                            データを読み込み中...
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
<div id="register-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-gray-800 border border-cyan-500/50 rounded-xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-700 flex justify-between items-center sticky top-0 bg-gray-800 z-10">
                <h2 class="text-xl font-bold text-cyan-400"><i class="fa-solid fa-plus-circle mr-2"></i>新規機器の登録</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
            </div>
            
            <form id="register-form" onsubmit="submitMachine(event)" class="p-6 space-y-4">
                <p class="text-sm text-gray-400 mb-4">点検整備記録簿に基づく機器情報を入力してください。</p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-sm font-medium text-gray-300 mb-1">機器管理番号 (システムID) <span class="text-red-400">*</span></label>
                        <input type="text" id="form-machineId" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none" placeholder="例: MAC-001">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">施設名称 <span class="text-red-400">*</span></label>
                        <input type="text" id="form-facilityName" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-cyan-500 outline-none" placeholder="例: スーパー環境 〇〇店">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">設置場所 (系統名)</label>
                        <input type="text" id="form-location" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-cyan-500 outline-none" placeholder="例: 屋上 A-1系統">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">メーカー (設備製造者)</label>
                        <input type="text" id="form-manufacturer" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-cyan-500 outline-none" placeholder="例: ダイキン工業">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">型式 <span class="text-red-400">*</span></label>
                        <input type="text" id="form-modelName" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-cyan-500 outline-none" placeholder="例: RZRP112B">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">製造番号 (製番)</label>
                        <input type="text" id="form-serialNumber" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-cyan-500 outline-none" placeholder="例: 12345678">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">使用冷媒 (フロン種類) <span class="text-red-400">*</span></label>
                        <select id="form-gasType" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-cyan-500 outline-none">
                            <option value="">選択してください</option>
                            <option value="R410A">R410A</option>
                            <option value="R32">R32</option>
                            <option value="R22">R22</option>
                            <option value="R404A">R404A</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-sm font-medium text-gray-300 mb-1">初期総充填量 (kg) <span class="text-red-400">*</span></label>
                        <input type="number" step="0.01" id="form-capacity" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2.5 text-white focus:border-cyan-500 outline-none" placeholder="例: 25.0">
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-700 mt-6 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition-colors">キャンセル</button>
                    <button type="submit" id="submit-btn" class="px-5 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-medium rounded-lg shadow-lg shadow-cyan-500/30 transition-colors flex items-center">
                        <i class="fa-solid fa-cloud-arrow-up mr-2"></i> 台帳に登録する
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
