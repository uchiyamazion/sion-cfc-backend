<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SION CFC Cloud</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (アイコン用) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* カスタムスクロールバー等 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    
    <!-- ヘッダー -->
    <nav class="bg-gray-800 border-b border-cyan-500/30 p-4 shadow-lg sticky top-0 z-10">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-cyan-400 tracking-wider">
                <i class="fa-solid fa-cloud"></i> SION CFC Cloud
            </h1>
            <div class="text-sm px-3 py-1 bg-gray-700 rounded-full border border-gray-600">
                管理者ダッシュボード
            </div>
        </div>
    </nav>

    <!-- メインコンテンツ -->
    <main class="container mx-auto p-4 mt-6">
        
        <!-- サマリーカード -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-md relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-cyan-400 text-5xl"><i class="fa-solid fa-server"></i></div>
                <div class="text-gray-400 text-sm mb-1 font-medium">登録機器数</div>
                <div class="text-4xl font-bold text-white" id="machine-count">-</div>
            </div>
            
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-md relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-yellow-400 text-5xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div class="text-gray-400 text-sm mb-1 font-medium">今月の要点検</div>
                <div class="text-4xl font-bold text-yellow-400">0<span class="text-lg font-normal text-gray-500 ml-2">件</span></div>
            </div>
            
            <div class="bg-gray-800 p-6 rounded-xl border border-red-900/50 shadow-md relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10 text-red-500 text-5xl"><i class="fa-solid fa-bell"></i></div>
                <div class="text-gray-400 text-sm mb-1 font-medium">漏洩アラート</div>
                <div class="text-4xl font-bold text-red-500">0<span class="text-lg font-normal text-gray-500 ml-2">件</span></div>
            </div>
        </div>
        
        <!-- コントロールパネル -->
        <div class="flex justify-between items-end mb-4 border-b border-gray-700 pb-2">
            <h2 class="text-xl font-semibold text-gray-200">フロン機器台帳</h2>
            <button onclick="fetchMachineData()" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-sm transition-colors shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-rotate-right mr-1"></i> 最新に更新
            </button>
        </div>

        <!-- データテーブル -->
        <div class="bg-gray-800 rounded-xl overflow-hidden border border-gray-700 shadow-lg">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="bg-gray-900/50 text-gray-400 text-sm border-b border-gray-700">
                            <th class="p-4 font-medium">管理番号</th>
                            <th class="p-4 font-medium">施設・設置場所</th>
                            <th class="p-4 font-medium">メーカー/型式</th>
                            <th class="p-4 font-medium text-center">ステータス</th>
                        </tr>
                    </thead>
                    <tbody id="machine-list">
                        <tr><td colspan="4" class="p-10 text-center text-gray-500">
                            <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-3 text-cyan-500"></i><br>
                            データを読み込み中...
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
